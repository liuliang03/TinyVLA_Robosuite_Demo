# Sawyer 机器人配置

robot:
  name: "Sawyer"
  dof: 7  # 自由度

  # 控制器配置
  controller:
    type: "OSC_POSE"
    impedance_mode: "fixed"
    kp: [100] * 6  # 位置/旋转增益
    kd: [10] * 6   # 阻尼增益
    force_limit: 200
    position_limits:
      x: [-0.6, 0.6]
      y: [-0.6, 0.6]
      z: [0.0, 0.9]

  # 夹爪配置
  gripper:
    type: "default"
    open_threshold: 0.05
    close_threshold: 0.02
    max_force: 15

  # 工作空间
  workspace:
    range:
      x: [-0.6, 0.6]
      y: [-0.6, 0.6]
      z: [0.0, 0.9]

    safety_limits:
      max_velocity: 0.8  # m/s
      max_acceleration: 4.0  # m/s^2
      max_jerk: 15.0  # m/s^3

# 相机配置
cameras:
  frontview:
    position: [0.6, 0.0, 0.5]
    quaternion: [0.5, 0.5, -0.5, 0.5]
    image_size: [224, 224]
    fov: 45

  birdview:
    position: [0.0, 0.0, 1.0]
    quaternion: [0.707, 0.0, 0.0, 0.707]
    image_size: [224, 224]
    fov: 60

  agentview:
    position: [0.4, 0.4, 0.4]
    quaternion: [0.0, 0.0, 0.0, 1.0]
    image_size: [224, 224]
    fov: 50
